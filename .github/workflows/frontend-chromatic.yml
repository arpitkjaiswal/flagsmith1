name: Frontend Chromatic

on:
  # Nothing outside these paths can change how a story renders. The lockfile is
  # included alongside package.json because `npm ci` installs from it, so a
  # transitive bump can change rendering without package.json moving.
  push:
    branches: [main]
    paths: &story_paths
      - frontend/web/components/**
      - frontend/web/styles/**
      - frontend/common/theme/**
      - frontend/documentation/**
      - frontend/.storybook/**
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/frontend-chromatic.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *story_paths

permissions:
  contents: read

jobs:
  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || !github.event.pull_request.draft
    env:
      CAN_PUBLISH: >-
        ${{ secrets.CHROMATIC_PROJECT_TOKEN != '' && github.actor != 'dependabot[bot]' &&
        (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook locally
        if: env.CAN_PUBLISH != 'true'
        run: npm run build-storybook:dev

      - name: Publish to Chromatic
        if: env.CAN_PUBLISH == 'true'
        uses: chromaui/action@v16
        with:
          workingDir: frontend
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Dev-mode build keeps React's act() in the bundle —
          # production strips it and breaks play function synthetic
          # events (Storybook #19758).
          buildScriptName: build-storybook:dev
          exitZeroOnChanges: true
          exitOnceUploaded: true
          onlyChanged: true
          autoAcceptChanges: main
