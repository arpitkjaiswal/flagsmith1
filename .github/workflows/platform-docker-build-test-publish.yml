name: Platform Build Docker Images, Test, and Publish

on:
  push:
    branches:
      - main
  release:
    types:
      - released

jobs:
  flagsmith-release:
    if: github.repository == 'Flagsmith/flagsmith'
    uses: ./.github/workflows/.reusable-platform-release.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
      pull-requests: write
      security-events: write
    secrets: inherit

  self-hosted-experiment:
    name: Test an experiment on the OSS image
    if: github.repository != 'Flagsmith/flagsmith'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      FIRST_MINUTE_FLAGSMITH_IMAGE: first-minute-flagsmith:ci

    steps:
      - uses: actions/checkout@v5

      - name: Build the OSS image from this commit
        run: |
          if docker build --progress plain --target oss-unified --tag first-minute-flagsmith:ci . > "$RUNNER_TEMP/first-minute-build.log" 2>&1; then
            cat "$RUNNER_TEMP/first-minute-build.log"
          else
            cat "$RUNNER_TEMP/first-minute-build.log"
            python3 - <<'PY'
          import os
          from pathlib import Path
          lines = (Path(os.environ["RUNNER_TEMP"]) / "first-minute-build.log").read_text().splitlines()
          message = "\n".join(lines[-30:]).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=OSS image build failed::{message}")
          PY
            exit 1
          fi

      - name: Start the reusable experiment lab
        run: |
          docker compose -f examples/first-minute/compose.yml up --build --wait --wait-timeout 240
          curl --fail --silent --show-error http://127.0.0.1:5173/ >/dev/null

      - name: Check SDK assignments and conversion counts against the warehouse
        run: docker compose -f examples/first-minute/compose.yml run --rm tools verify

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f examples/first-minute/compose.yml logs --tail=80
