name: Platform Build Docker Images, Test, and Publish

on:
  push:
    branches:
      - main
  release:
    types:
      - released

jobs:
  flagsmith-release:
    if: github.repository == 'Flagsmith/flagsmith'
    uses: ./.github/workflows/.reusable-platform-release.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
      pull-requests: write
      security-events: write
    secrets: inherit

  self-hosted-experiment:
    name: Test an experiment on the OSS image
    if: github.repository != 'Flagsmith/flagsmith'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: examples/first-minute/package-lock.json

      - name: Install the experiment SDK
        working-directory: examples/first-minute
        run: npm ci

      - name: Build the OSS image from this commit
        run: docker build --target oss-unified --tag docker.flagsmith.com/flagsmith/flagsmith:latest .

      - name: Start Flagsmith and its warehouse
        run: |
          docker compose pull postgres
          docker compose up --wait --wait-timeout 180 --pull never flagsmith flagsmith-task-processor
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-max-time 60 --max-time 5 http://127.0.0.1:8000/health >/dev/null

      - name: Check SDK assignments and conversion counts against the warehouse
        shell: bash
        run: |
          docker compose exec -T -e ALLOW_ADMIN_INITIATION_VIA_CLI=true flagsmith \
            python manage.py bootstrap --email runner@example.invalid --organisation-name 'First Minute CI' >/dev/null
          token=$(docker compose exec -T flagsmith python manage.py drf_create_token runner@example.invalid | awk '/^Generated token / {print $3}')
          test -n "$token"
          echo "::add-mask::$token"
          FLAGSMITH_MANAGEMENT_TOKEN="$token" python3 examples/first-minute/equal_chance.py
